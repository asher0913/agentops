name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q
      - name: Report reproduces the committed results
        run: |
          agentops report --out /tmp/results > /dev/null
          for f in evaluation fault_sweep replay; do
            python -c "import json,sys; assert json.load(open('/tmp/results/$f.json')) == json.load(open('results/$f.json')), '$f'"
          done
          echo reproduced
